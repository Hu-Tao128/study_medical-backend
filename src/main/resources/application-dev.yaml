spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://db.spxgotrytjkofqinsklw.supabase.co:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/studymedical}
      auto-index-creation: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_ISSUER_URI:https://spxgotrytjkofqinsklw.supabase.co/auth/v1}

app:
  dev-mode: true
  jwt:
    secret: dev-secret-key-for-testing-only-min-256-bits
    expiration: 86400000
