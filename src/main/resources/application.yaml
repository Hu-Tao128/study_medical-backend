spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: backend

  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:20MB}
      max-request-size: ${MAX_UPLOAD_SIZE:20MB}

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://aws-1-us-east-1.pooler.supabase.com:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/studymedical}
      auto-index-creation: true

  h2:
    console:
      enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${FIREBASE_ISSUER_URI:https://securetoken.google.com/studymedical}
          jwk-set-uri: ${FIREBASE_JWK_SET_URI:https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com}
          audiences: ${FIREBASE_AUDIENCE:studymedical}

server:
  port: ${PORT:8081}

app:
  jwt:
    secret: ${JWT_SECRET:study-medical-secret-key-2024-secure}
    expiration: 86400000
  ai:
    openai:
      # Sin api-key el pipeline RAG de documentos queda deshabilitado (503).
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
