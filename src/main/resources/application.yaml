spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://aws-1-us-east-1.pooler.supabase.com:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/studymedical}
      auto-index-creation: true

  h2:
    console:
      enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_ISSUER_URI:https://spxgotrytjkofqinsklw.supabase.co/auth/v1}

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:study-medical-secret-key-2024-secure}
    expiration: 86400000
